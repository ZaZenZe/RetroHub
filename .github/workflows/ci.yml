name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  repository_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # Check out repository source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js 18.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install root dependencies
      - name: Install root dependencies
        run: npm install

      # Install each microservice's dependencies
      - name: Install service dependencies
        run: |
          npm install --prefix backend/auth-service
          npm install --prefix backend/user-service
          npm install --prefix backend/game-service
          npm install --prefix backend/community-service
          npm install --prefix backend/ai-service

      # Run lint across backend sources
      - name: Run lint
        run: npm run lint

      # Placeholder test step (replace with real tests later)
      - name: Run tests (placeholder)
        run: |
          npm test --if-present || echo "No tests defined yet"

      # Emit a success message when all steps pass
      - name: Build success message
        run: echo "CI completed successfully"

  build-docker:
    name: Build Docker images for services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: "."
            dockerfile: "./Dockerfile"
            image: "test-root"
          - context: "backend"
            dockerfile: "backend/ai-service/Dockerfile"
            image: "test-backend-ai-service"
          - context: "backend"
            dockerfile: "backend/auth-service/Dockerfile"
            image: "test-backend-auth-service"
          - context: "backend"
            dockerfile: "backend/community-service/Dockerfile"
            image: "test-backend-community-service"
          - context: "backend"
            dockerfile: "backend/game-service/Dockerfile"
            image: "test-backend-game-service"
          - context: "backend"
            dockerfile: "backend/user-service/Dockerfile"
            image: "test-backend-user-service"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch build support)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm build succeeded
        run: |
          echo "Dockerfile: ${{ matrix.dockerfile }}"
          echo "Built image: ${{ matrix.image }}:${{ github.sha }}"
